server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # compression — keep the canvas JS/CSS snappy
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA-style fallback so deep links/refreshes always land on the page
    location / {
        try_files $uri $uri/ /index.html;
    }

    # long-lived cache for versioned static assets
    location ~* \.(jpg|jpeg|png|webp|css|js|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # never cache the manifest so frame updates appear immediately
    location = /frames/manifest.json {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }
}
